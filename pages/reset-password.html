<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <meta name="referrer" content="no-referrer">
  
  <link rel="stylesheet" href="/assets/css/pages/reset-password.css">
  <script src="/assets/js/pages/reset-password.js" defer></script>

  <!-- Search metadata -->
  <title>Reset Your Password | MechWay</title>
  <meta name="description" content="Set a new password using your MechWay account reset link.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.mechway.in/pages/reset-password.html">
  <meta property="og:site_name" content="MechWay">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_IN">
  <meta property="og:title" content="Reset Your Password | MechWay">
  <meta property="og:description" content="Set a new password using your MechWay account reset link.">
  <meta property="og:url" content="https://www.mechway.in/pages/reset-password.html">
  <meta property="og:image" content="https://www.mechway.in/assets/images/mechanic.jpg">
  <meta property="og:image:alt" content="MechWay vehicle mechanic service">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Reset Your Password | MechWay">
  <meta name="twitter:description" content="Set a new password using your MechWay account reset link.">
  <meta name="twitter:image" content="https://www.mechway.in/assets/images/mechanic.jpg">
<link rel="stylesheet" href="/assets/css/navigation.css">
</head>
<body>
  <header class="mw-site-nav"><a href="/index.html" aria-label="MechWay home" class="mw-nav-logo"><img src="/assets/images/mechwaynew.png" alt="MechWay" width="150" height="60"></a><a href="/pages/mech-login.html">Mechanic Login</a></header>
  <main>
    <section aria-labelledby="reset-title">
      <p class="eyebrow">MECHANIC ACCOUNT</p>
      <h1 id="reset-title">Set a new password</h1>
      <p class="intro">Secure your account with a new password.</p>
      <div id="reset-status" class="status" role="status" aria-live="polite" hidden></div>
      <form id="password-form">
        <label for="new-password">New password</label>
        <input id="new-password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required aria-describedby="password-hint">
        <p id="password-hint" class="hint">At least 8 characters.</p>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <label class="show-password"><input id="show-password" type="checkbox"> Show passwords</label>
        <button id="reset-submit" type="submit">Update Password</button>
      </form>
      <a class="login-link" href="/pages/mech-login.html">Back to Login</a>
    </section>
  </main>
  <footer>MechWay Support <a href="mailto:support@mechway.in">support@mechway.in</a></footer>
</body>
</html>
